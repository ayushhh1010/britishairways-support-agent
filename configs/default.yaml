# Single source of truth for the pipeline. Overridable via env vars (see .env.example).
brand: British_Airways

paths:
  raw_csv: data/raw/twcs/twcs.csv
  interim: data/interim
  processed: data/processed
  golden: golden
  results: reports/results
  cache: llm_cache

llm:
  provider: gemini                    # gemini | groq | cerebras | ollama | openai_compatible
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  # Provider reality, all measured (DECISIONS.md #22):
  #   Groq free      200k tokens/DAY per model -> exhausted by ~120 agent calls.
  #   Cerebras       advertised free tier needs billing credits -> HTTP 402.
  #   Mistral        account blocked at console sign-in for this user.
  #   Local 8B       ~18 tok/s on 4GB VRAM (CPU fallback) -> ~2 min/call.
  #   Gemini free    ~1000+ requests/day, and requests are the binding limit here.
  # Generator is Gemini, judge is GEMMA -- a different model family on the same key,
  # so the judge never grades output from its own family (self-preference bias).
  gen_model: gemini-3.5-flash-lite         # Google Gemini -> classify + triage + draft
  judge_model: gemma-4-31b-it         # Google Gemma (different family) -> judge
  judge_model_secondary: gemini-3.5-flash   # same family as generator; measures bias
  prelabel_model_a: gemini-3.5-flash
  prelabel_model_b: gemma-4-31b-it
  # Gemma rejects response_format=json_object (HTTP 500) and prefixes answers with a
  # <thought> block; parse_json strips it.
  no_json_mode_models:
    - gemma
  taxonomy_style: terse
  reasoning_effort: low               # gpt-oss only; ignored elsewhere
  temperature: 0.0
  max_tokens: 2000              # must cover hidden thinking tokens + the JSON
  request_timeout: 120
  max_retries: 8      # 503 'high demand' spikes need patience, not more requests
  rpm_limit: 10
  tpm_limit: 200000
  concurrency: 2
  group_size: 25                      # tickets/request; 220 cases -> 9 requests.
                                      # Free tier is 20 requests/DAY per model, so
                                      # agent(9) + ablation(9) must fit inside it.
  model_limits:
    default:
      max_output: 8000
      otpm: 100000

sampling:
  seed: 20260909
  # Cases must have a real customer message and a real brand reply to be usable.
  min_customer_chars: 30
  max_customer_chars: 600
  taxonomy_sample: 900                # messages clustered for taxonomy induction
  golden_size: 220                    # hand-adjudicated evaluation set
  retrieval_pool: 12000               # historical cases available to the retriever
  holdout_exclude_golden: true

retrieval:
  k: 3
  max_evidence_chars: 140
  min_similarity: 0.08
  vectorizer:
    ngram_range: [1, 2]
    min_df: 2
    max_features: 60000
    sublinear_tf: true

triage:
  # Escalating a solvable ticket costs agent time; auto-handling one that needed a
  # human costs the customer. We weight the second error 3x in the headline metric.
  false_auto_handle_cost: 3.0
  false_escalate_cost: 1.0
